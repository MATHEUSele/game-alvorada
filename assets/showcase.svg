<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="4 Pilares de Game Alvorada — Santuário Cinzento">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#141E38"/>
      <stop offset="100%" stop-color="#1E1038"/>
    </linearGradient>
    <linearGradient id="c1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="c2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="c3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="c4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#scBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Cabeçalho discreto -->
  <text x="600" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FDE68A" letter-spacing="1.6">ARQUITETURA &amp; PILARES JOGÁVEIS (PRÉ-ALFA v0.3)</text>

  <!-- Card 1: Salão Real -->
  <g transform="translate(24 58)">
    <rect width="276" height="256" rx="14" fill="url(#c1Grad)" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="20" y="20" width="54" height="54" rx="12" fill="#0B1120" fill-opacity="0.68" stroke="url(#goldStroke)" stroke-width="1.5"/>
    <!-- Arco do Portal -->
    <path d="M35 62 L35 42 A12 12 0 0 1 59 42 L59 62" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="47" cy="45" r="5" fill="#60A5FA"/>
    <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Salão Real</text>
    <text x="88" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#93C5FD">HubMap.ts • Cidadela</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">Rotunda luminosa em mármore</text>
    <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">e cerâmica com luz solar,</text>
    <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">vitrais e Jardim Real externo.</text>
    <rect x="20" y="176" width="236" height="58" rx="10" fill="#0B1120" fill-opacity="0.62" stroke="#1E3A8A" stroke-width="1"/>
    <text x="32" y="199" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#FDE68A">• Portal das Masmorras [F]</text>
    <text x="32" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#94A3B8">• Alas Forja, Loja &amp; Baú</text>
  </g>

  <!-- Card 2: Combate Dawnblade -->
  <g transform="translate(316 58)">
    <rect width="276" height="256" rx="14" fill="url(#c2Grad)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="20" y="20" width="54" height="54" rx="12" fill="#0B1120" fill-opacity="0.68" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Espada e arco -->
    <path d="M31 58 C40 62, 56 54, 62 34" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M34 58 L58 34" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
    <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Dawnblade 3D</text>
    <text x="88" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#7DD3FC">Player.ts • SwordVfx.ts</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">Protagonista Blender (23 ossos)</text>
    <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">com ataque em movimento:</text>
    <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">camadas UpperBody / LowerBody.</text>
    <rect x="20" y="176" width="236" height="58" rx="10" fill="#0B1120" fill-opacity="0.62" stroke="#0284C7" stroke-width="1"/>
    <text x="32" y="199" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7DD3FC">• Corte 1-2-3 • Giro 360°</text>
    <text x="32" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#FDE68A">• Investida • ULT Julgamento</text>
  </g>

  <!-- Card 3: Masmorras e Esqueletos -->
  <g transform="translate(608 58)">
    <rect width="276" height="256" rx="14" fill="url(#c3Grad)" stroke="#A855F7" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="20" y="20" width="54" height="54" rx="12" fill="#0B1120" fill-opacity="0.68" stroke="#C084FC" stroke-width="1.5"/>
    <!-- Cristal / Montanha -->
    <polygon points="32,62 47,30 62,62" fill="#581C87" stroke="#D8B4FE" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="47" cy="49" r="4" fill="#F87171"/>
    <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Catacumbas</text>
    <text x="88" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#D8B4FE">DungeonMap • SkeletonEnemy</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">Salas randômicas 104x104 na</text>
    <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">montanha com paredes cutaway</text>
    <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">e 6 PointLights dinâmicas.</text>
    <rect x="20" y="176" width="236" height="58" rx="10" fill="#0B1120" fill-opacity="0.62" stroke="#6B21A8" stroke-width="1"/>
    <text x="32" y="199" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#E9D5FF">• Esqueletos Minion/Warrior</text>
    <text x="32" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#FDE68A">• Campeão, Baús &amp; Minimapa</text>
  </g>

  <!-- Card 4: PC + Celular QR -->
  <g transform="translate(900 58)">
    <rect width="276" height="256" rx="14" fill="url(#c4Grad)" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="20" y="20" width="54" height="54" rx="12" fill="#0B1120" fill-opacity="0.68" stroke="#FBBF24" stroke-width="1.5"/>
    <!-- Smartphone + QR -->
    <rect x="37" y="29" width="20" height="36" rx="4" fill="none" stroke="#FDE68A" stroke-width="2.2"/>
    <rect x="42" y="36" width="4" height="4" fill="#7DD3FC"/>
    <rect x="48" y="36" width="4" height="4" fill="#FDE68A"/>
    <rect x="42" y="42" width="4" height="4" fill="#FDE68A"/>
    <rect x="48" y="42" width="4" height="4" fill="#7DD3FC"/>
    <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">PC + Mobile QR</text>
    <text x="88" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#FCD34D">MobileUi • TouchControls</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">QR Code automático em Wi-Fi</text>
    <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">para jogar direto no celular</text>
    <text x="20" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#E2E8F0">com HUD adaptável e PWA.</text>
    <rect x="20" y="176" width="236" height="58" rx="10" fill="#0B1120" fill-opacity="0.62" stroke="#B45309" stroke-width="1"/>
    <text x="32" y="199" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#FDE68A">• Analógico 360° + Correr</text>
    <text x="32" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#A7F3D0">• Cluster radial estilo MOBA</text>
  </g>
</svg>
