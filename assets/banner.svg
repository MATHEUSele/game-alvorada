<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Game Alvorada — Santuário Cinzento">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="48%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D4A64A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FDE68A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Brilhos solares dourados -->
  <circle cx="1040" cy="56" r="190" fill="#F59E0B" fill-opacity="0.16"/>
  <circle cx="154" cy="260" r="145" fill="#60A5FA" fill-opacity="0.14"/>

  <!-- Emblema à esquerda: Brasão Real + Espada Arcana + Estrela da Alvorada -->
  <rect x="76" y="72" width="156" height="156" rx="28" fill="url(#cardGrad)" stroke="#D4A64A" stroke-opacity="0.65" stroke-width="2"/>
  <path d="M154 96 L196 112 L192 158 C190 184 174 202 154 212 C134 202 118 184 116 158 L112 112 Z"
        fill="#0F172A" fill-opacity="0.55" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Lâmina da espada arcana -->
  <path d="M154 108 L161 124 L158 176 L150 176 L147 124 Z" fill="#E0F2FE"/>
  <!-- Guarda e pomo dourados -->
  <path d="M136 176 L172 176" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="154" y1="176" x2="154" y2="196" stroke="#D4A64A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="154" cy="199" r="4" fill="#FDE68A"/>
  <!-- Estrela da alvorada no topo da espada -->
  <polygon points="154,99 157,106 164,109 157,112 154,119 151,112 144,109 151,106" fill="#FDE68A"/>

  <!-- Título e subtítulo -->
  <text x="268" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Game Alvorada</text>
  <text x="270" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#FDE68A">Santuário Cinzento — Action RPG Isométrico 3D no Navegador</text>

  <!-- Pills / tags com largura folgada -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="270" y="202" width="160" height="30" rx="15" fill="#0F172A" fill-opacity="0.55" stroke="#93C5FD" stroke-opacity="0.45"/>
    <text x="350" y="222" text-anchor="middle" fill="#DBEAFE">Three.js + TS</text>

    <rect x="442" y="202" width="180" height="30" rx="15" fill="#0F172A" fill-opacity="0.55" stroke="#FCD34D" stroke-opacity="0.5"/>
    <text x="532" y="222" text-anchor="middle" fill="#FDE68A">PC + Celular QR</text>

    <rect x="634" y="202" width="170" height="30" rx="15" fill="#0F172A" fill-opacity="0.55" stroke="#6EE7B7" stroke-opacity="0.45"/>
    <text x="719" y="222" text-anchor="middle" fill="#A7F3D0">Blender GLB 3D</text>
  </g>
</svg>
