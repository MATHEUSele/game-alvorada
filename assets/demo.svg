<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="game-alvorada — vite dev, build e masmorra">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; }
    .cmd { fill: #E2E8F0; font-weight: 700; }
    .prompt { fill: #38BDF8; font-weight: 700; }
    .muted { fill: #94A3B8; }
    .ok { fill: #34D399; font-weight: 600; }
    .warn { fill: #FBBF24; font-weight: 600; }
    .accent { fill: #FDE68A; font-weight: 600; }
    .abyss { fill: #D8B4FE; font-weight: 600; }

    @keyframes step1 { 0%, 4% { opacity: 0; } 8%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step2 { 0%, 16% { opacity: 0; } 20%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step3 { 0%, 34% { opacity: 0; } 38%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step4 { 0%, 50% { opacity: 0; } 54%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step5 { 0%, 66% { opacity: 0; } 70%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes step6 { 0%, 78% { opacity: 0; } 82%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .s1 { animation: step1 11s infinite; }
    .s2 { animation: step2 11s infinite; }
    .s3 { animation: step3 11s infinite; }
    .s4 { animation: step4 11s infinite; }
    .s5 { animation: step5 11s infinite; }
    .s6 { animation: step6 11s infinite; }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Janela de terminal escura -->
  <rect width="860" height="380" rx="14" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <path d="M0 14 Q0 0 14 0 L846 0 Q860 0 860 14 L860 40 L0 40 Z" fill="#1E293B"/>

  <!-- 3 bolinhas da barra superior -->
  <circle cx="24" cy="20" r="6" fill="#EF4444"/>
  <circle cx="44" cy="20" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="20" r="6" fill="#10B981"/>
  <text x="430" y="25" text-anchor="middle" class="mono muted">game-alvorada — runtime, build &amp; catacumbas</text>

  <!-- Bloco 1 -->
  <g class="s1">
    <text x="26" y="74" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">npm run dev</tspan></text>
  </g>
  <g class="s2">
    <text x="44" y="98" class="mono accent">VITE v6.4.6 ready • PC: http://localhost:5173/</text>
    <text x="44" y="120" class="mono muted">Mobile QR: /__mobile-qr.json (analógico 360° + cluster MOBA)</text>
  </g>

  <!-- Bloco 2 -->
  <g class="s3">
    <text x="26" y="158" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">npm run build</tspan></text>
  </g>
  <g class="s4">
    <text x="44" y="182" class="mono ok">✓ tsc --noEmit &amp;&amp; vite build — 21 modules transformed (dist/ gerado)</text>
    <text x="44" y="204" class="mono muted">✓ protagonist.glb (23 ossos, 10 animações) + 39 modelos CC0 (.glb)</text>
  </g>

  <!-- Bloco 3 -->
  <g class="s5">
    <text x="26" y="242" class="mono"><tspan class="prompt">❯ </tspan><tspan class="cmd">[Portal Norte → F] Entrar na Masmorra</tspan></text>
  </g>
  <g class="s6">
    <text x="44" y="266" class="mono abyss">✓ Catacumbas Cinzentas • Grade 104x104 • 6–8 salas + Esqueletos IA</text>
    <text x="44" y="288" class="mono muted">✓ Montanha subterrânea • 6 luzes dinâmicas • Minimapa isométrico</text>
    <text x="26" y="330" class="mono"><tspan class="prompt">❯ </tspan><tspan class="warn">Dawnblade: Corte [1/J] • Giro 360° [2/Q] • Investida [3/E] • ULT [4/R] </tspan><tspan class="cursor prompt">█</tspan></text>
  </g>
</svg>
