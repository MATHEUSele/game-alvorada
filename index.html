<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santuário Cinzento — ARPG Pré-Alfa</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div class="vignette" aria-hidden="true"></div>

      <header class="hud-top-left">
        <div class="area-header">
          <span class="badge">PRÉ-ALFA v0.1</span>
          <h1>Santuário Cinzento</h1>
        </div>
        <p class="area-subtitle">Área Central • Hub Seguro</p>
      </header>

      <aside class="hud-bottom-left">
        <div class="analog-widget" aria-label="Indicador de direção WASD">
          <div class="analog-ring">
            <div class="analog-crosshair-h"></div>
            <div class="analog-crosshair-v"></div>
            <div id="analog-knob" class="analog-knob"></div>
          </div>
          <div class="analog-labels">
            <span class="analog-title">Movimento</span>
            <span id="move-state" class="analog-state">Parado</span>
          </div>
        </div>

        <div class="controls-bar">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Mover</span>
          <span><kbd>Shift</kbd> Correr</span>
          <span><kbd>Scroll</kbd> Zoom</span>
        </div>
      </aside>

      <div id="dungeon-prompt" class="dungeon-prompt" aria-live="polite">
        <span class="prompt-icon">✦</span>
        <span>Entrada das Catacumbas — Masmorras Randômicas em breve</span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
